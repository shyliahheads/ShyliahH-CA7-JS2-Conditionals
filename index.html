
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Shyliah Heads">
    <title>Bear Ninja Hunter</title>
</head>
<body>
    <h1>Bear Ninja Hunter</h1>

    <p id="demo">Welcome to Bear Ninja Hunter!</p>

    <script>
     // Step 1: Ask the player for their name.
let playerName = prompt("Welcome to Bear Hunter Ninja! What is your name?");

// Step 2: Greet the player.
alert("Hi " + playerName + " Let's Play!!");

// Step 3: Ask the player to choose a character.
let playerChoice = prompt("Who are you: Bear, Ninja, or Hunter?");

// Step 4: Store the computer's choice.
let computerChoice = "Bear";

// Step 5: Create the results message using concatenation.
let resultMessage = playerName + " chose " + playerChoice +
    ", computer chose " + computerChoice;

// Step 6: Display the result on the webpage.
document.getElementById("demo").innerHTML = resultMessage;

// Display the result in the browser console.
console.log(resultMessage);
    </script>
</body>
</html>
